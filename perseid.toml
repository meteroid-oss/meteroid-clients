#:schema https://raw.githubusercontent.com/meteroid-oss/perseid/main/perseid.schema.json
spec = "spec/openapi.json"
name = "Meteroid"
sdks = ["rust", "typescript", "python", "go", "java"]
base_url = "https://api.meteroid.com"
webhooks = true

[metadata]
