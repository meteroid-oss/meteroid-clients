name: Go Lint

on:
  push:
    branches:
      - main
    paths:
      - 'go/**'
      - '.github/workflows/go-lint.yml'
      - 'spec/**'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go-lint.yml'
      - 'spec/**'

# When pushing to a PR, cancel any jobs still running for the previous head commit of the PR
concurrency:
  # head_ref is only defined for pull requests, run_id is always unique and defined so if this
  # workflow was not triggered by a pull request, nothing gets cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # The SDK has no third-party dependencies, so there is no go.sum.
          cache-dependency-path: go/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: go

      - name: go vet
        run: go vet ./...
        working-directory: go

      - name: Build
        run: go build ./...
        working-directory: go

      - name: Test
        run: go test -race ./...
        working-directory: go
