name: Python Release

# Publishes with PyPI Trusted Publishing: PyPI trusts this workflow's GitHub OIDC
# identity, so no API token is stored. Configure it once on PyPI (project
# `meteroid`, owner `meteroid-oss`, repository `meteroid-clients`, workflow
# `python-release.yml`, environment `release`).

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Mega Releaser
    types:
      - completed

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      # Lets the job request the OIDC token PyPI Trusted Publishing verifies.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          python-version: '3.12'

      - name: Build sdist and wheel
        run: uv build
        working-directory: python

      # `always` fails if Trusted Publishing is not configured, instead of falling
      # back to other credentials.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        working-directory: python
