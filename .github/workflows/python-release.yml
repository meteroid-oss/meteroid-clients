name: Python Release

# DRAFT: this workflow is untested because publishing needs credentials that do
# not exist yet. Before enabling it, either
#   (a) set the `PYPI_API_TOKEN` secret on the `release` environment, or
#   (b) preferably, configure PyPI Trusted Publishing for this repository and
#       replace the `password:` line below with nothing (OIDC is used
#       automatically when `id-token: write` is granted).

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Mega Releaser
    types:
      - completed

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      # Required for PyPI Trusted Publishing (option (b) above).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          python-version: '3.12'

      - name: Build sdist and wheel
        run: uv build
        working-directory: python

      - name: Publish to PyPI
        run: uv publish
        working-directory: python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
