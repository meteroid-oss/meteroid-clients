name: Codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Switch to `uses: meteroid-oss/perseid@v0.2.0` with `command: generate --check` once released.
  PERSEID_REV: 1b0f8562162ba1f345b679ae20aab1b63217298a

jobs:
  check-generated:
    name: Generated SDKs are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install perseid and google-java-format
        run: |
          cargo install --locked --git https://github.com/meteroid-oss/perseid --rev "$PERSEID_REV" --root "$RUNNER_TEMP/perseid"
          curl -fsSL -o "$RUNNER_TEMP/gjf.jar" https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar
          printf '#!/bin/sh\nexec java -jar %s "$@"\n' "$RUNNER_TEMP/gjf.jar" > "$RUNNER_TEMP/perseid/bin/google-java-format"
          chmod +x "$RUNNER_TEMP/perseid/bin/google-java-format"
          echo "$RUNNER_TEMP/perseid/bin" >> "$GITHUB_PATH"
      - run: perseid generate --check
