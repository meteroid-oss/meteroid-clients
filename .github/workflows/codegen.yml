name: Codegen

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# When pushing to a PR, cancel any jobs still running for the previous head commit of the PR
concurrency:
  # head_ref is only defined for pull requests, run_id is always unique and defined so if this
  # workflow was not triggered by a pull request, nothing gets cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-git-consistency:
    name: Check for uncommitted changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The published image is only rebuilt after a push to main (codegen-docker.yml), so a PR
      # that changes the codegen binary must be checked against an image built from its own
      # source; otherwise it is validated against the previous binary and can never pass.
      # Templates are bind-mounted by regen_openapi.py, so template-only changes keep the
      # published image.
      - name: Detect changes to the codegen binary
        id: codegen
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # An unreachable base makes git diff fail, which falls through to a rebuild.
          if git diff --quiet "$base" HEAD -- codegen/src codegen/Cargo.toml codegen/Cargo.lock codegen/Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull codegen Docker image
        if: steps.codegen.outputs.changed == 'false'
        run: docker pull ghcr.io/meteroid-oss/openapi-codegen:latest

      - name: Build codegen Docker image from this commit
        if: steps.codegen.outputs.changed == 'true'
        run: docker build -t ghcr.io/meteroid-oss/openapi-codegen:latest codegen/

      # The Python tasks format their output on the host (python/scripts/codegen_format.sh
      # runs a pinned `uvx ruff`), since the codegen image ships no `ruff`.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"

      - name: Regen openapi libs
        run: ./regen_openapi.py

      - name: Check for uncommitted changes
        run: |
          gs=$(git status -s)
          if [[ -n "$gs" ]]; then
            echo 'there are uncommitted changes!'
            git status
            exit 1
          else
            echo 'all good.'
          fi
