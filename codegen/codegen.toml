[global]
input_files = ["openapi.json"]

[rust]
extra_mounts = { "rust/.rustfmt.toml" = "/app/.rustfmt.toml" }
[[rust.task]]
template = "templates/rust/api_resource.rs.jinja"
output_dir = "rust/src/api"
[[rust.task]]
template = "templates/rust/api_summary.rs.jinja"
output_dir = "rust/src/api"
[[rust.task]]
template = "templates/rust/component_type_summary.rs.jinja"
output_dir = "rust/src/models"
[[rust.task]]
template = "templates/rust/component_type.rs.jinja"
output_dir = "rust/src/models"

[java]
[[java.task]]
template = "templates/java/api_resource.java.jinja"
output_dir = "java/src/main/java/com/meteroid/api"
[[java.task]]
template = "templates/java/operation_options.java.jinja"
output_dir = "java/src/main/java/com/meteroid/api"
[[java.task]]
template = "templates/java/api_summary.java.jinja"
output_dir = "java/src/main/java/com/meteroid"
[[java.task]]
template = "templates/java/component_type.java.jinja"
output_dir = "java/src/main/java/com/meteroid/models"

[typescript]
[[typescript.task]]
template = "templates/typescript/api_resource.ts.jinja"
output_dir = "typescript/src/api"
[[typescript.task]]
template = "templates/typescript/api_summary.ts.jinja"
output_dir = "typescript/src"
[[typescript.task]]
template = "templates/typescript/component_type_summary.ts.jinja"
output_dir = "typescript/src/models"
[[typescript.task]]
template = "templates/typescript/component_type.ts.jinja"
output_dir = "typescript/src/models"

# @meteroid/browser: models only. The resource templates hardcode the server
# client (`Meteroid(token)`, `./request`), so its calls are hand-written.
[typescript-client]
[[typescript-client.task]]
template = "templates/typescript/component_type_summary.ts.jinja"
input_files = ["client/v1/openapi.json"]
output_dir = "browser/src/models"
[[typescript-client.task]]
template = "templates/typescript/component_type.ts.jinja"
input_files = ["client/v1/openapi.json"]
output_dir = "browser/src/models"

[python]
# The codegen image doesn't ship `ruff`, so formatting happens on the host
# right after generation (see python/scripts/codegen_format.sh).
extra_codegen_args = ["--no-postprocess"]
extra_shell_commands = ["python/scripts/codegen_format.sh"]
[[python.task]]
template = "templates/python/api_resource.py.jinja"
output_dir = "python/meteroid/api"
[[python.task]]
template = "templates/python/api_summary.py.jinja"
output_dir = "python/meteroid/api"
[[python.task]]
template = "templates/python/component_type_summary.py.jinja"
output_dir = "python/meteroid/models"
[[python.task]]
template = "templates/python/component_type.py.jinja"
output_dir = "python/meteroid/models"

# The Go SDK is a single flat package (`meteroid`), so every task writes into
# `go/`. The codegen image has no Go toolchain, hence --no-postprocess plus an
# explicit gofmt pass afterwards (local gofmt when available, Docker otherwise).
[go]
extra_codegen_args = ["--no-postprocess"]
extra_shell_commands = [
    'if command -v gofmt >/dev/null 2>&1; then gofmt -w go; else docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd)/go":/src -w /src golang:1.24-alpine gofmt -w .; fi',
]
[[go.task]]
template = "templates/go/api_resource.go.jinja"
output_dir = "go"
[[go.task]]
template = "templates/go/api_summary.go.jinja"
output_dir = "go"
[[go.task]]
template = "templates/go/component_type.go.jinja"
output_dir = "go"
