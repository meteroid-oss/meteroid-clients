[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meteroid"
version = "0.26.0"
description = "Meteroid billing API client"
readme = "README.md"
license = "MIT"
authors = [{ name = "Meteroid", email = "support@meteroid.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/meteroid-oss/meteroid-clients"
Homepage = "https://meteroid.com"

[project.optional-dependencies]
dev = ["mypy>=1.18", "pytest>=8", "ruff==0.14.10"]

[tool.hatch.build.targets.wheel]
packages = ["meteroid"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
